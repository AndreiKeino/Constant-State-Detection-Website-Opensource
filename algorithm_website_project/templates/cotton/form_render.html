{# variables: #}
    {# form_data #}
{% csrf_token %}
{# form_data = {{ form }} #}
{% for field in form_data %}
    <div class="form-control w-full max-w-xs mb-4">
      {# <!-- DaisyUI Form Label Wrap --> #}
      <label class="label whitespace-pre-wrap" for="{{ field.id_for_label }}">
        <span class="label-text font-semibold">{{ field.label }}</span>
      </label>
      {# <!-- Render the field input --> #}
      {# <!-- Note: You will need to attach the "input input-bordered" classes to the widget attrs in forms.py --> #}
      {{ field }}
      {# <!-- Error Handling Label --> #}
      {% if field.errors %}
        <label class="label">
          <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
        </label>
        {% else %}
            {% if field.field.required %}
                <p>
                  <span class="label-text-alt text-warning font-bold">
                      * Required
                  </span>
                </p>
            {% endif %}
      {% endif %}
    </div>

  {% endfor %}


<button
  id="submit-btn"
  type="submit"
  class="btn btn-primary w-full"
>Submit</button>
