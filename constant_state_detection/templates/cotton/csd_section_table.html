<div class="mx-auto bg-base-100 p-8 rounded-2xl
shadow-xl">
  <h2 class="text-2xl font-bold mb-6 text-center">
      {{ main_header }}
  </h2>

    <div class="overflow-y-auto max-h-96 border border-base-200 rounded-box">
      <table class="table table-pin-rows">
        <thead>
          <tr>
              <th colspan="3" class="text-center text-lg font-bold bg-base-300">
              {{ secondary_header }}</th>
          </tr>
          {% if  table_data %}
          <tr>
            <th>#</th>
            <th>Start index</th>
            <th>Finish index (inclusive)</th>
            <th>Length</th>
          </tr>
          {% endif %}
        </thead>

          <tbody>

            {% for r in table_data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ r.start }}</td>
                    <td>{{ r.finish }}</td>
                    <td>{{ r.diff_len }}</td>
                </tr>
          {% endfor %}
          </tbody>
      </table>
    </div>
</div>
